{% load static %}
<section class="band" aria-labelledby="cta-title">
  <div class="wrap band__inner">
    <div>
      <img class="band__mark" src="{% static 'assets/images/logo-mark.png' %}" width="320" height="316" alt="" aria-hidden="true">
      <h2 class="band__title" id="cta-title">{{ band_title|default:"Come and build something with us." }}</h2>
      <p class="band__text">{{ band_text|default:"Tell us who you are and what you are interested in. We read every message, and you will hear back from a person on the leadership team." }}</p>
    </div>
    <div><a class="btn btn--on-dark" href="{% url 'content:join' %}">{{ band_cta|default:"Join the community" }}</a></div>
  </div>
</section>

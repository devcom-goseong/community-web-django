{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}The Vault{% endblock %} — KDU Developer Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap">
<style>
  :root{
    --navy:#0a1c3a; --navy-2:#0f2650; --navy-3:#16305f; --line:#2a3f6b;
    --gold:#e9c65b; --gold-bright:#f4d774; --gold-deep:#b8941f;
    --ivory:#f3efe2; --muted:#b9c6e0; --danger:#e06666; --ok:#8bd4a3;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'PT Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ivory);background:linear-gradient(160deg,#081633 0%,#0a1c3a 55%,#0c2148 100%);
    background-attachment:fixed;font-size:15px;line-height:1.55;}
  a{color:var(--gold);text-decoration:none} a:hover{color:var(--gold-bright);text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  header.vault{border-bottom:2px solid var(--gold-deep);background:rgba(6,16,38,.6)}
  .vault__bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--gold);letter-spacing:.02em}
  .brand:hover{text-decoration:none;color:var(--gold-bright)}
  .brand .crown{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  nav.vault__nav a{color:var(--ivory);margin-left:18px;font-weight:700}
  nav.vault__nav a:hover{color:var(--gold)}
  main{padding:28px 0 60px}
  h1{font-size:26px;margin:0 0 4px;color:var(--gold);font-weight:700}
  h1 .sub{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
  h2{font-size:14px;text-transform:none;color:var(--gold-deep);margin:28px 0 12px;font-weight:700;
     border-bottom:1px solid var(--line);padding-bottom:6px}
  .crumbs{font-size:13px;color:var(--muted);margin:0 0 18px}
  .crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--gold)}
  .panel{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
  .btn{display:inline-block;background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#3a2d00;font-weight:700;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px}
  .btn:hover{filter:brightness(1.06);text-decoration:none;color:#3a2d00}
  .btn--ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-deep)}
  .btn--ghost:hover{background:rgba(233,198,91,.1);color:var(--gold-bright)}
  .btn--danger{background:linear-gradient(180deg,#e88,#e06666);color:#3a0000}
  .btn--sm{padding:5px 11px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{display:block;background:var(--navy-2);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:10px;padding:16px 18px;color:var(--ivory)}
  .card:hover{border-color:var(--gold);text-decoration:none;color:var(--ivory);transform:translateY(-1px);transition:.12s}
  .card__name{font-weight:700;font-size:16px;color:var(--ivory)}
  .card__count{color:var(--gold);font-weight:700;font-size:22px;margin-top:6px}
  .card__count small{color:var(--muted);font-weight:400;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{background:var(--navy-3);color:var(--gold);text-align:left;padding:11px 14px;font-weight:700;
    border-bottom:2px solid var(--gold-deep);white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ivory)}
  tbody tr:hover td{background:rgba(255,255,255,.02)}
  .row-actions{white-space:nowrap;text-align:right}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap}
  .search{display:flex;gap:8px}
  input[type=text],input[type=search],input[type=email],input[type=url],input[type=number],
  input[type=password],input[type=date],input[type=datetime-local],select,textarea{
    width:100%;background:#0c2149;border:1px solid var(--line);color:var(--ivory);border-radius:8px;
    padding:9px 11px;font-family:inherit;font-size:14px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,198,91,.18)}
  .search input{min-width:220px}
  form.stack p{margin:0 0 16px}
  form.stack label{display:block;font-weight:700;color:var(--muted);margin-bottom:5px;font-size:13px}
  form.stack .helptext{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  form.stack ul.errorlist{list-style:none;margin:6px 0 0;padding:0;color:var(--danger);font-size:13px}
  .form-actions{display:flex;gap:10px;align-items:center;margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
  .msg{border-radius:8px;padding:11px 15px;margin:0 0 14px;font-weight:700}
  .msg--success{background:rgba(139,212,163,.12);border:1px solid var(--ok);color:var(--ok)}
  .msg--error,.msg--danger{background:rgba(224,102,102,.12);border:1px solid var(--danger);color:var(--danger)}
  .msg--info,.msg--warning{background:rgba(233,198,91,.1);border:1px solid var(--gold-deep);color:var(--gold)}
  .pager{display:flex;gap:12px;align-items:center;justify-content:center;margin:18px 0;color:var(--muted);font-size:14px}
  .muted{color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .pad{padding:18px}
</style>
</head>
<body>
<header class="vault">
  <div class="wrap vault__bar">
    <a class="brand" href="{% url 'vault:dashboard' %}"><span class="crown">&#128081;</span> The Vault</a>
    <nav class="vault__nav">
      <a href="{% url 'vault:dashboard' %}">Dashboard</a>
      <a href="{% url 'vault:lock' %}">Lock</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    {% if messages %}{% for m in messages %}<div class="msg msg--{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>

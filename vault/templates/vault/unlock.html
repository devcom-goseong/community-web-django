<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Vault — KDU Developer Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&amp;display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'PT Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#123067 0%,#0a1c3a 45%,#06122b 100%);
    color:#f3efe2;padding:20px}
  .door{width:380px;max-width:92vw;background:#0f2650;border:1px solid #2a3f6b;
    border-top:3px solid #e9c65b;border-radius:16px;padding:34px 32px;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .crown{font-size:40px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  h1{font-size:23px;text-align:center;color:#e9c65b;margin:8px 0 2px;font-weight:700;letter-spacing:.02em}
  p.sub{text-align:center;color:#b9c6e0;font-size:13px;margin:0 0 22px}
  label{display:block;font-size:13px;color:#b9c6e0;font-weight:700;margin-bottom:6px}
  input[type=password]{width:100%;background:#0c2149;border:1px solid #2a3f6b;color:#f3efe2;
    border-radius:9px;padding:13px 14px;font-size:17px;font-family:inherit;letter-spacing:.04em}
  input[type=password]:focus{outline:none;border-color:#e9c65b;box-shadow:0 0 0 2px rgba(233,198,91,.2)}
  button{margin-top:16px;width:100%;padding:13px;font-size:16px;font-weight:700;color:#3a2d00;
    background:linear-gradient(180deg,#f4d774,#e9c65b);border:0;border-radius:9px;cursor:pointer}
  button:hover{filter:brightness(1.06)}
  .err{color:#e06666;font-size:13px;margin-top:14px;text-align:center;font-weight:700}
  .foot{text-align:center;color:#6f80a6;font-size:12px;margin-top:20px}
</style>
</head>
<body>
  <form class="door" method="post" action="{% url 'vault:unlock' %}">
    {% csrf_token %}
    <div class="crown">&#128081;</div>
    <h1>The Vault</h1>
    <p class="sub">KDU Developer Community</p>
    <label for="v-pass">Enter the vault password</label>
    <input type="password" id="v-pass" name="password" autofocus autocomplete="off" spellcheck="false">
    <button type="submit">Unlock</button>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <p class="foot">Authorised access only.</p>
  </form>
</body>
</html>
